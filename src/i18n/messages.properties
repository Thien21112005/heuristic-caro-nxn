about.title=About Caro
about.intro=A Gomoku / Tic-Tac-Toe game for any board from 3×3 to 20×20, with three AI levels. Built with Java Swing and FlatLaf as an academic project. Handwriting set in Mali.
about.howToPlay=How to play
about.rules=<b>3×3 to 5×5:</b> fill a whole row, column or diagonal.<br><b>6×6 and up:</b> line up 5 pieces in a row in any direction.<br>X always moves first. Against the AI you choose X or O.
about.controls=Controls
about.controls.body=<b>Mouse wheel</b> zoom &nbsp;·&nbsp; <b>Drag</b> pan the board<br><b>Arrows, Enter</b> play from the keyboard<br><b>Ctrl+Z</b> undo (when enabled) &nbsp;·&nbsp; <b>H</b> hint &nbsp;·&nbsp; <b>R</b> restart &nbsp;·&nbsp; <b>Esc</b> back<br><b>F11</b> full screen &nbsp;·&nbsp; <b>N</b> move numbers<br>After a game: <b>← →</b> step through it, <b>Space</b> plays it back
